project: assessment

ct:
  id: 101
  hostname: assessment
  template: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
  storage: local-lvm
  disk: 16
  bridge: vmbr0
  ip: dhcp
  cores: 2
  memory: 4096
  swap: 1024
  unprivileged: 1

shared_tools:
  - git
  - openssh-client
  - curl
  - jq
  - ca-certificates

services:
  auth-backend:
    path: auth/backend
    runtimes:
      - java@17
      - maven
      - mongodb@7

  assessment-backend:
    path: assessment/backend
    runtimes:
      - java@17
      - maven
      - postgresql@15

  assessment-frontend:
    path: assessment/frontend
    runtimes:
      - node@20
      - npm
      - pm2
