project: assessment

ct:
  id: 101
  hostname: assessment
  template: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
  storage: local-lvm
  disk: 16
  bridge: vmbr0
  ip: dhcp
  cores: 2
  memory: 4096
  swap: 1024
  unprivileged: 1

expose:
  enabled: true
  hostname: assessment.jogjaitcamp.com
  service: assessment-frontend
  proxy_ct: proxy
  cloudflare_account: jogjaitcamp
  gateway_port: 26674
  additional:
    # rag.jogjaitcamp.com disabled with the rag-backend service.
    # - hostname: rag.jogjaitcamp.com
    #   service: rag-backend

deploy:
  github:
    enabled: true
    branch: main
    debounce_ms: 15000
    webhook_port: 8790
    webhook_path: /__eco/github/deploy

# Staging footprint: second deployment on CT 1000 at
# staging-assessment.jogjaitcamp.com, redeployed by a webhook accepting any
# branch except main. Feature branches land here before main.
staging:
  ct: 1000

storage:
  minio:
    ct: storage
    region: us-east-1

shared_tools:
  - git
  - openssh-client
  - curl
  - jq
  - ca-certificates

domains: []
  # auth / email-manager / storage / profile are consumed from the LXS
  # registry (services declare `lxs:`), so no source repos are tracked.
  # Disabled temporarily: rag-backend hogged RAM/CPU and caused 524 timeouts.
  # Remove comments to re-enable rag (source-composed):
  # - rag:
  #     dev: optional

services:
  email-manager-backend:
    lxs: email-manager@1.0.1
    grants:
      secrets: [SERVER_PORT, API_BASE_PATH, MONGODB_URI, BREVO_API_KEY]

  # rag-backend disabled with the rag domain (see domains: above).
  # rag-backend:
  #   path: rag/backend
  #   runtimes:
  #     - rust
  #     - mongodb@7
  #     - onnxruntime

  auth-backend:
    lxs: auth@1.0.2
    grants:
      secrets: [JWT_SECRET, MONGODB_URI, SERVER_PORT]

  storage-backend:
    lxs: storage@1.0.5
    grants:
      secrets: [SERVER_PORT, API_BASE_URL, S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY]

  profile-backend:
    lxs: profile@1.0.2
    grants:
      secrets: [MONGODB_URI, JWT_SECRET, SERVER_PORT, API_BASE_URL]

  assessment-backend:
    path: assessment/backend
    runtimes:
      - rust
      - postgresql@15

  assessment-frontend:
    path: assessment/frontend
    runtimes:
      - node@20
      - npm
      - pm2

# The estate core repo (this manifest's git). Required for remote deploys
# (`eco up --remote`) and the deploy webhook, which resolve the project origin
# from here when the source is shipped (no .git on the host/CT).
composition:
  git: git@github.com:kelastanpatembok/assessment.git
  branch: main
