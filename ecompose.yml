# ecompose v2 — assessment
# Assessment estate (assessment.jogjaitcamp.com): Vite+Svelte frontend +
# Rust/Postgres backend composed from source (this repo). email-manager,
# auth, storage, profile composed from the LXS registry.
#
# Builds happen on the developer machine; the server is executable-only.

project: assessment
main: assessment

estates:
  assessment:
    hostname: assessment.jogjaitcamp.com
    ingress: tunnel
    cloudflare_account: jogjaitcamp
    services:
      - assessment-frontend
      - assessment-backend
      - email-manager-backend
      - auth-backend
      - storage-backend
      - profile-backend

services:
  assessment-frontend:
    path: frontend
    runtimes: [node@20]

  assessment-backend:
    path: backend
    binary: assessment-backend
    runtimes: [rust, postgresql@15]

  email-manager-backend:
    lxs: email-manager@1.0.1
    grants: { secrets: [SERVER_PORT, API_BASE_PATH, MONGODB_URI, BREVO_API_KEY] }

  auth-backend:
    lxs: auth@1.0.2
    grants: { secrets: [JWT_SECRET, MONGODB_URI, SERVER_PORT] }

  storage-backend:
    lxs: storage@1.0.5
    grants: { secrets: [SERVER_PORT, API_BASE_URL, S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY] }

  profile-backend:
    lxs: profile@1.0.2
    grants: { secrets: [MONGODB_URI, JWT_SECRET, SERVER_PORT, API_BASE_URL] }
