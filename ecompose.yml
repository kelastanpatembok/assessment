project: assessment

ct:
  id: 101
  hostname: assessment
  template: local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst
  storage: local-lvm
  disk: 16
  bridge: vmbr0
  ip: dhcp
  cores: 2
  memory: 4096
  swap: 1024
  unprivileged: 1

expose:
  enabled: true
  hostname: assessment.jogjaitcamp.com
  service: assessment-frontend
  proxy_ct: proxy
  cloudflare_account: jogjaitcamp
  gateway_port: 26674
  additional:
    # rag.jogjaitcamp.com disabled with the rag-backend service.
    # - hostname: rag.jogjaitcamp.com
    #   service: rag-backend

deploy:
  github:
    enabled: true
    branch: main
    debounce_ms: 15000
    webhook_port: 8790
    webhook_path: /__eco/github/deploy

# Staging footprint: second deployment on CT 1000 at
# staging-assessment.jogjaitcamp.com, redeployed by a webhook accepting any
# branch except main. Feature branches land here before main.
staging:
  ct: 1000

storage:
  minio:
    ct: storage
    region: us-east-1

shared_tools:
  - git
  - openssh-client
  - curl
  - jq
  - ca-certificates

domains:
  - auth
  - email-manager
  # Disabled temporarily: rag-backend hogged RAM/CPU and caused 524 timeouts.
  # Remove comments to re-enable.
  # - rag:
  #     dev: optional

services:
  email-manager-backend:
    path: email-manager/backend
    runtimes:
      - rust
      - mongodb@7

  # rag-backend disabled with the rag domain (see domains: above).
  # rag-backend:
  #   path: rag/backend
  #   runtimes:
  #     - rust
  #     - mongodb@7
  #     - onnxruntime

  auth-backend:
    path: auth/backend
    runtimes:
      - rust
      - mongodb@7

  photos-backend:
    path: photos/backend
    runtimes:
      - rust

  profile-backend:
    path: profile/backend
    runtimes:
      - rust
      - mongodb@7

  assessment-backend:
    path: assessment/backend
    runtimes:
      - java@17
      - maven
      - postgresql@15

  assessment-frontend:
    path: assessment/frontend
    runtimes:
      - node@20
      - npm
      - pm2
