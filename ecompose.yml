# ecompose v2 — assessment
# Assessment estate (assessment.jogjaitcamp.com): Vite+Svelte frontend +
# Rust/Postgres backend composed from source (this repo). email-manager,
# storage, profile composed from the LXS registry. auth composed from source
# (declarative roles). The estate front door is the gateway LXS (deny-by-default
# ACL), replacing the generated Caddyfile.
#
# Builds happen on the developer machine; the server is executable-only.

project: assessment
main: assessment

data:
  postgres: 102
  mongo: 102

estates:
  assessment:
    hostname: assessment.jogjaitcamp.com
    ingress: tunnel
    cloudflare_account: jogjaitcamp
    services:
      - gateway
      - assessment-frontend
      - assessment-backend
      - email-manager-backend
      - auth-backend
      - storage-backend
      - profile-backend

services:
  gateway:
    lxs: gateway@0.4.0
    port: 4902

  assessment-frontend:
    path: frontend
    port: 4207
    runtimes: [node@20]
    access:
      routes:
        # The SPA shell is public (homepage, signin/signup, assets). Everything
        # under a protected prefix below overrides this catch-all.
        - path: /*
          level: public
        # The homepage hero photo lives at /psikolog.webp, which would be caught
        # by the /psikolog* role route below — pin it public so the exact match
        # (higher score) wins over the wildcard.
        - path: /psikolog.webp
          level: public
        # Staff areas are role-gated at the edge (session cookie holds the JWT).
        - path: /admin*
          level: role:superadmin
          cookie: assessment_token
        - path: /counselor*
          level: role:gurubk
          cookie: assessment_token
        - path: /afiliator*
          level: role:afiliator
          cookie: assessment_token
        - path: /psikolog*
          level: role:psikolog
          cookie: assessment_token
        # Authenticated areas (any logged-in user).
        - path: /student*
          level: auth
          cookie: assessment_token
        - path: /profil*
          level: auth
          cookie: assessment_token
        - path: /credentials*
          level: auth
          cookie: assessment_token
        - path: /assignment-modules*
          level: auth
          cookie: assessment_token
        - path: /tes-gratis*
          level: auth
          cookie: assessment_token

  assessment-backend:
    path: backend
    binary: assessment-backend
    port: 7242
    runtimes: [rust, postgresql@15]
    access:
      routes:
        - path: /api/assessment-backend/*
          level: auth
        # The frontend's PUBLIC_API_URL points at /api/v1 (configgen default);
        # the backend nests under /api. Rewrite so dashboard/API calls land.
        - path: /api/v1/*
          level: auth
          strip: /api/v1
          rewrite: /api

  email-manager-backend:
    lxs: email-manager@1.0.1
    port: 3142
    grants: { secrets: [SERVER_PORT, API_BASE_PATH, MONGODB_URI, BREVO_API_KEY] }

  auth-backend:
    path: ../../lxs/auth/backend
    port: 2051
    runtimes:
      - rust
      - mongodb@7
    binary: rwid-auth-service
    access:
      routes:
        - path: /api/auth/login
          level: public
        - path: /api/auth/register
          level: public
        - path: /api/auth/register-with-profile
          level: public
        - path: /api/auth/verify-email
          level: public
        - path: /api/auth/users/check-existence
          level: public
        - path: /api/auth/*
          level: auth
        - path: /auth-api/auth/login
          level: public
          strip: /auth-api
          rewrite: /api
        - path: /auth-api/auth/register
          level: public
          strip: /auth-api
          rewrite: /api
        - path: /auth-api/auth/register-with-profile
          level: public
          strip: /auth-api
          rewrite: /api
        - path: /auth-api/auth/verify-email
          level: public
          strip: /auth-api
          rewrite: /api
        - path: /auth-api/auth/users/check-existence
          level: public
          strip: /auth-api
          rewrite: /api
        - path: /auth-api/*
          level: auth
          strip: /auth-api
          rewrite: /api

  storage-backend:
    lxs: storage@1.0.6
    port: 4437
    grants: { secrets: [SERVER_PORT, API_BASE_URL, S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY] }
    access:
      routes:
        - path: /api/storage/*
          level: auth

  profile-backend:
    lxs: profile@1.0.2
    port: 4481
    grants: { secrets: [MONGODB_URI, JWT_SECRET, SERVER_PORT, API_BASE_URL] }
    access:
      routes:
        # Frontend calls /api/profile/users/:id (PUBLIC_PROFILE_URL); the profile
        # LXS nests under /api and serves /api/users/:id. Rewrite the prefix.
        - path: /api/profile/*
          level: auth
          strip: /api/profile
          rewrite: /api

auth:
  email_verification:
    enabled: false
  roles:
    - name: public
      level: public
    - name: superadmin
      level: auth
    - name: gurubk
      level: auth
    - name: afiliator
      level: auth
    - name: psikolog
      level: auth
    - name: siswa
      level: auth
      default: true
