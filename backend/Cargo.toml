[package]
name = "assessment-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "bigdecimal", "macros"] }
bigdecimal = { version = "0.4", features = ["serde", "std"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
futures-util = "0.3"
async-trait = "0.1"
rand = "0.8"

# NOTE: the release profile (opt-level/lto) is defined at the eco-generated
# workspace root; a per-member profile would be ignored anyway.
