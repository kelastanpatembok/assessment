server:
  port: ${SERVER_PORT:2002}
  servlet:
    context-path: /api

spring:
  application:
    name: assessment-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/assessment}
    username: ${DATABASE_USERNAME:eko}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}

auth:
  base-url: ${AUTH_BASE_URL:http://localhost:2000/api}

app:
  auth-base-url: ${AUTH_BASE_URL:http://localhost:2000/api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:2001,http://localhost:3000}

logging:
  level:
    com.assessment: INFO
    org.flywaydb: INFO
